name: "PR checks"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

jobs:
  check-build:
    name: "Build image"
    runs-on: ubuntu-latest

    container:
      image: quay.io/podman/stable:v5.8.9@sha256:2a53680d80c91a1c7ffd648202846dd78c265a568aa08ef5c815f1ed4cc41a82
      options: --privileged

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Build image"
        run: |
          podman build --no-hosts --no-hostname .
